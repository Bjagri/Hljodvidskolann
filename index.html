<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hljóðhringir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4EFEA; --ink:#1B2A41; --ink-soft:#4A5A72; --card:#FFFFFF; --line:rgba(27,42,65,.16);
  --water:#1F6470; --water-deep:#123F48;
  --perc:#FF6B3D; --tone:#FFC93C; --amb:#7BD389; --glow:#F2A7FF;
  --shadow:rgba(10,30,40,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13212A; --ink:#EAF2EE; --ink-soft:#A7B8C3; --card:#1D2E3A; --line:rgba(234,242,238,.16);
    --water:#18525C; --water-deep:#0C2D34; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#13212A; --ink:#EAF2EE; --ink-soft:#A7B8C3; --card:#1D2E3A; --line:rgba(234,242,238,.16);
  --water:#18525C; --water-deep:#0C2D34; --shadow:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);color:var(--ink);
  font-family:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background-color .9s ease,color .9s ease;
}
body.w-tofrar{--paper:#24163F;--ink:#F6ECFF;--ink-soft:#CBB6EA;--card:#34225C;--line:rgba(246,236,255,.2);--water:#3C2878;--water-deep:#170D33;--shadow:rgba(0,0,0,.5);--glow:#F2A7FF}
body.w-haf{--paper:#0E3A4A;--ink:#E6FBFF;--ink-soft:#9FD3DE;--card:#145063;--line:rgba(230,251,255,.18);--water:#1B6E86;--water-deep:#082733;--shadow:rgba(0,0,0,.4);--glow:#8FF3FF}
body.w-geimur{--paper:#0B1026;--ink:#EEF0FF;--ink-soft:#A9B0D6;--card:#171E40;--line:rgba(238,240,255,.16);--water:#1A2250;--water-deep:#05081A;--shadow:rgba(0,0,0,.55);--glow:#FFE9A3}
body.w-robot{--paper:#23272E;--ink:#E8F6FF;--ink-soft:#9AA9B5;--card:#2F353E;--line:rgba(232,246,255,.16);--water:#2C3440;--water-deep:#161A20;--shadow:rgba(0,0,0,.5);--glow:#38E1FF}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.2s ease}
body.w-tofrar::before,body.w-geimur::before{background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 33% 72%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 58% 12%,var(--glow) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 76% 44%,#fff 50%,transparent 51%),
    radial-gradient(2.5px 2.5px at 88% 82%,var(--glow) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 90%,#fff 50%,transparent 51%),
    radial-gradient(2px 2px at 47% 52%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 14%,#fff 50%,transparent 51%);opacity:1;animation:twinkle 4s ease-in-out infinite alternate}
body.w-haf::before{opacity:1;background-image:
    radial-gradient(circle at 8% 85%,transparent 7px,rgba(255,255,255,.35) 8px,transparent 9.5px),
    radial-gradient(circle at 27% 62%,transparent 4px,rgba(255,255,255,.3) 5px,transparent 6.5px),
    radial-gradient(circle at 63% 78%,transparent 10px,rgba(255,255,255,.25) 11px,transparent 12.5px),
    radial-gradient(circle at 85% 40%,transparent 5px,rgba(255,255,255,.3) 6px,transparent 7.5px),
    radial-gradient(circle at 46% 25%,transparent 3px,rgba(255,255,255,.3) 4px,transparent 5.5px);
  animation:rise 9s ease-in-out infinite alternate}
body.w-robot::before{opacity:1;background-image:linear-gradient(rgba(56,225,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(56,225,255,.08) 1px,transparent 1px);background-size:32px 32px}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-36px)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--perc);outline-offset:2px}

/* ---------- Header ---------- */
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px 10px}
.brand{font-weight:700;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand i{display:inline-flex;gap:4px}
.brand i b{width:12px;height:12px;display:block}
.brand i b:nth-child(1){background:var(--perc);border-radius:50%}
.brand i b:nth-child(2){background:var(--tone);border-radius:3px;transform:rotate(45deg) scale(.85)}
.brand i b:nth-child(3){background:var(--amb);border-radius:42% 58% 63% 37%/45% 40% 60% 55%}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 2px 0 var(--line)}
.tabs button{padding:9px 18px;border-radius:999px;font-weight:500;font-size:16px;color:var(--ink-soft)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.world-btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:16px;background:var(--card);box-shadow:0 2px 0 var(--line);display:flex;align-items:center;gap:8px}
.world-btn .wi{font-size:19px;line-height:1}
body.w-tofrar .world-btn{background:linear-gradient(120deg,#8E5BFF,#F27BD8);color:#fff;box-shadow:0 0 22px rgba(242,167,255,.55)}
body.w-haf .world-btn{background:linear-gradient(120deg,#178FB0,#4FDCC8);color:#fff;box-shadow:0 0 22px rgba(143,243,255,.45)}
body.w-geimur .world-btn{background:linear-gradient(120deg,#2B3A8C,#B57BFF);color:#fff;box-shadow:0 0 22px rgba(255,233,163,.35)}
body.w-robot .world-btn{background:linear-gradient(120deg,#3A4452,#1EA9C9);color:#fff;box-shadow:0 0 22px rgba(56,225,255,.45)}
.wmenu{position:fixed;z-index:31;right:14px;width:min(92vw,340px);background:var(--card);border-radius:26px;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.28);display:none}
.wmenu.on{display:block}
.wopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:18px}
.wopt .wi{font-size:26px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--paper);flex:none}
.wopt b{display:block;font-size:17px;font-weight:600}
.wopt small{display:block;color:var(--ink-soft);font-size:14px;line-height:1.25}
.wopt.on{background:var(--paper)}
.wopt.on .wi{background:var(--card)}
.woff{display:block;width:100%;padding:12px;margin-top:4px;border-radius:999px;background:var(--paper);font-weight:500}

main{position:relative;z-index:1;flex:1;min-height:0;display:flex}
.page{flex:1;min-height:0;display:none;flex-direction:column}
.page.on{display:flex}

/* ---------- Page 1: pond ---------- */
.pond{
  position:relative;flex:1;min-height:240px;margin:4px 18px 0;border-radius:32px;overflow:hidden;
  background:#8DBEEF;
  transition:background .9s ease;
}
.pond-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80%,420px);text-align:center;color:rgba(255,255,255,.82);font-size:19px;line-height:1.4}
.blob{position:absolute;left:0;top:0;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation}
.shape{width:var(--sz);height:var(--sz)}
.shape svg,.mini svg{display:block;width:100%;height:100%;overflow:visible}
.shd{fill:var(--shadow);transition:fill .9s ease}
.wv{fill:none;stroke:#1B2A41;stroke-width:3.4;stroke-linecap:round;opacity:.7}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 46s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blob .lbl{font-size:14px;font-weight:500;color:#fff;background:rgba(0,0,0,.28);padding:2px 10px;border-radius:12px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blob .ring-fx{position:absolute;top:0;left:50%;width:var(--sz);height:var(--sz);margin-left:calc(var(--sz) / -2);border-radius:50%;border:3px solid #fff;opacity:0;pointer-events:none}
.blob.ping .ring-fx{animation:ripple .7s ease-out}
@keyframes ripple{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.7)}}
.blob.new .shape{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.2)}to{transform:scale(1)}}
body.magic .shd{fill:var(--glow);opacity:.5}

.rec-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px 18px 10px}
.rec{background:var(--card);border-radius:26px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:14px;align-items:center;box-shadow:0 3px 0 var(--line);transition:background-color .9s ease}
.rec-btn{grid-row:1/4;width:74px;height:74px;display:grid;place-items:center;position:relative}
.rec-btn .shape{--sz:64px}
.rec-btn .dot{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 5px var(--ink)}
.rec.on .rec-btn .dot{border-radius:4px;box-shadow:none;background:var(--ink)}
.rec h2{margin:0;font-size:20px;font-weight:600}
.rec p{margin:2px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.3}
.rec .file{justify-self:start;margin-top:6px;font-size:14px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.rec.on{background:var(--ink);color:var(--paper)}
.rec.on p,.rec.on .file{color:var(--paper);opacity:.8}
.rec .time{font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px 14px}
.textbtn{font-size:14px;color:var(--ink-soft);padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.textbtn.warn{color:#D6402A;font-weight:600}
.next{background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:600;font-size:17px}

/* ---------- Page 2: rings ---------- */
#page-rada{overflow-y:auto;-webkit-overflow-scrolling:touch}
.transport{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:6px 18px 12px}
.play{width:68px;height:68px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 var(--shadow);flex:none}
.play svg{width:26px;height:26px}
.play .i-stop{display:none}
.play.on .i-play{display:none}
.play.on .i-stop{display:block}
.tempo{display:flex;align-items:center;gap:10px;font-weight:500}
.tempo output{min-width:3ch;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;background:var(--line);width:180px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ink);border:4px solid var(--card)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--card)}
.hint{color:var(--ink-soft);font-size:15px;margin-left:auto;max-width:300px;line-height:1.3}

.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0 18px}
.ringcard{background:var(--card);border-radius:30px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 var(--line);transition:opacity .3s,background-color .9s ease}
.ringcard h3{margin:0 0 4px;font-size:19px;font-weight:600}
.ringcard.muted .ring{opacity:.35}
.ring{position:relative;width:100%;max-width:310px;touch-action:none;cursor:grab}
.ring::before{content:"";display:block;padding-top:100%}
.rotor{position:absolute;top:9%;left:9%;right:9%;bottom:9%;border-radius:50%;transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.rotor::before{content:"";position:absolute;top:12%;left:12%;right:12%;bottom:12%;border-radius:50%;border:3px dotted var(--line)}
.k0 .rotor{background:radial-gradient(circle,transparent 58%,rgba(255,107,61,.12) 59%)}
.k1 .rotor,.k2 .rotor{background:radial-gradient(circle,transparent 58%,rgba(255,201,60,.16) 59%)}
.rotor.drag,.rotor.drag .si{transition:none}
.hub{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink-soft)}
.hub svg{width:46%;height:46%}
.slot{position:absolute;width:24%;height:24%;margin:-12% 0 0 -12%;border-radius:50%;border:2.5px dashed var(--line);background:var(--paper);touch-action:none}
.slot.filled{border-color:transparent;background:transparent;cursor:grab}
.slot.over,.aslot.over{border-color:var(--ink);border-style:solid;background:var(--line)}
.si{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.si .mini{width:86%;height:86%;transition:transform .09s ease-out}
.slot.hit .si .mini{transform:scale(1.22)}

.deg{position:absolute;bottom:-6px;right:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.phwrap{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.ph{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid var(--ink);opacity:.25;transition:opacity .2s}
.playing .ph{opacity:1}
.rctl{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;background:var(--paper);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--paper)}
.mute{padding:7px 14px;border-radius:999px;font-size:14px;background:var(--paper)}
.mute[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;padding:14px 18px 18px}
.panel{background:var(--card);border-radius:28px;padding:14px 16px;box-shadow:0 3px 0 var(--line);transition:background-color .9s ease}
.panel h3{margin:0 0 10px;font-size:18px;font-weight:600}
.aslots{display:flex;gap:10px}
.aslot{flex:1;min-height:76px;border-radius:24px;border:2.5px dashed var(--line);background:var(--paper);display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;color:var(--ink-soft);touch-action:none;line-height:1.25}
.aslot.filled{border-style:solid;border-color:transparent;color:var(--ink);font-weight:500}
.aslot .mini{width:48px;height:48px;flex:none}
.aslot.filled.live .mini{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12)}}
.avol{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.avol input{flex:1;width:auto}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--paper);font-size:15px;font-weight:500;touch-action:none;cursor:grab;max-width:100%}
.chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .mini{width:32px;height:32px;flex:none}
.chip.ping{animation:chipping .35s}
@keyframes chipping{50%{transform:scale(1.08)}}
.empty{color:var(--ink-soft);font-size:15px;line-height:1.4;margin:0}

.mini{display:block}

.ghost{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:50}
.ghost .mini{width:100%;height:100%;opacity:.9}

/* ---------- Editor sheet ---------- */
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,20,30,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.clear{background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:880px;z-index:21;background:var(--card);border-radius:30px 30px 0 0;
  padding:18px 22px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.1,.4,1),background-color .9s ease;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.ed-top{display:flex;align-items:center;gap:14px}
.ed-top .mini{width:44px;height:44px;flex:none}
.ed-top input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:600;color:var(--ink);background:var(--paper);border:0;border-radius:14px;padding:8px 14px;-webkit-user-select:text;user-select:text}
.done{background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-weight:600}
.types{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
.types button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--paper);font-size:15px;color:var(--ink-soft)}
.types button .mini{width:22px;height:22px;box-shadow:none}
.types button.on{background:var(--ink);color:var(--paper)}
.wave{position:relative;height:150px;border-radius:18px;background:var(--paper);overflow:hidden;touch-action:none;cursor:ew-resize}
.wave canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.sel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 0 2000px rgba(120,130,140,.38)}
@supports not (background:color-mix(in srgb,red 30%,transparent)){.sel{background:rgba(255,255,255,.15)}}
.hnd{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
.hnd::after{content:"";position:absolute;top:50%;left:50%;width:26px;height:42px;margin:-21px 0 0 -13px;border-radius:13px;background:var(--ink);box-shadow:inset 0 0 0 4px var(--c)}
.pl{position:absolute;top:0;bottom:0;width:2px;background:#fff;display:none}
.ed-info{display:flex;gap:18px;margin-top:10px;color:var(--ink-soft);font-size:15px;font-variant-numeric:tabular-nums}
.ed-act{display:flex;gap:10px;align-items:center;margin-top:12px}
.listen{display:flex;align-items:center;gap:8px;background:var(--c);color:#1B2A41;padding:11px 20px;border-radius:999px;font-weight:600;font-size:17px}
.listen svg{width:16px;height:16px}
.del{margin-left:auto;font-size:15px;color:var(--ink-soft);padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.del.warn{color:#D6402A;font-weight:600}

/* ---------- Slot popover ---------- */
.pop{position:fixed;z-index:31;background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:230px;display:none}
.pop.on{display:block}
.pop .pname{font-weight:600;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitch{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:999px;padding:4px;margin-bottom:10px}
.pitch button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;font-weight:600;display:grid;place-items:center}
.pitch div{text-align:center;line-height:1.1}
.pitch b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.pitch small{font-size:12px;color:var(--ink-soft)}
.pop .rm{width:100%;padding:10px;border-radius:999px;background:var(--paper);font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:60;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:18px;max-width:min(90vw,520px);text-align:center;font-size:16px;line-height:1.35;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.hidden{display:none}

@media (max-width:820px){
  .rec-row{grid-template-columns:1fr}
  .rec{grid-template-rows:auto auto auto}
  .rings{grid-template-columns:1fr}
  .ring{max-width:290px}
  .lower{grid-template-columns:1fr}
  .hint{margin-left:0}
}
@media (max-width:820px) and (orientation:portrait) and (min-width:560px){
  .rings{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .spin,body.magic::before,.aslot.filled.live .mini{animation:none}
}

/* ---------- additions v4 ---------- */
.sel-wrap select{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
.songrec{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;background:var(--card);font-weight:600;box-shadow:0 2px 0 var(--line);font-variant-numeric:tabular-nums}
.rdot{width:14px;height:14px;border-radius:50%;background:#E5483B;flex:none}
.songrec.on{background:#E5483B;color:#fff}
.songrec.on .rdot{background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.steps{display:flex;align-items:center;background:var(--paper);border-radius:999px;padding:3px}
.steps button{width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:600;display:grid;place-items:center}
.steps span{font-size:14px;padding:0 4px;min-width:52px;text-align:center}
.tune{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-top:10px;padding:10px 14px;border-radius:16px;background:var(--paper);font-size:15px}
.tune span{flex:1;min-width:200px}
.tune label{display:flex;align-items:center;gap:8px;font-weight:500}
.tune input{width:22px;height:22px;accent-color:var(--ink)}
#songSheet{--c:#FF6B3D}
#songSheet h2{margin:0;font-size:22px;font-weight:600;flex:none}
#songSheet audio{width:100%;margin-top:14px}
.share{font-size:16px;font-weight:500;padding:11px 18px;border-radius:999px;background:var(--paper)}

/* ---------- bubbly, hand-made shapes ---------- */
:root{
  --blob-1:42px 58px 46px 62px / 56px 44px 60px 48px;
  --blob-2:60px 44px 64px 46px / 46px 60px 44px 58px;
  --blob-3:50px 64px 42px 56px / 62px 48px 56px 42px;
  --pill-1:26px 34px 28px 38px / 34px 26px 38px 28px;
  --pill-2:36px 26px 38px 28px / 26px 36px 28px 38px;
  --bub-1:52% 48% 55% 45% / 48% 54% 46% 52%;
  --bub-2:46% 54% 44% 56% / 55% 45% 53% 47%;
  --bub-3:55% 45% 50% 50% / 45% 52% 48% 55%;
}
.pond{border-radius:64px 92px 72px 98px / 82px 60px 94px 70px}
.dust{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.rec:nth-child(1){border-radius:var(--blob-1)}
.rec:nth-child(2){border-radius:var(--blob-2)}
.rec:nth-child(3){border-radius:var(--blob-3)}
.ringcard:nth-child(1){border-radius:var(--blob-2)}
.ringcard:nth-child(2){border-radius:var(--blob-3)}
.ringcard:nth-child(3){border-radius:var(--blob-1)}
.panel:nth-child(1){border-radius:var(--blob-3)}
.panel:nth-child(2){border-radius:var(--blob-1)}
.aslot:nth-child(1){border-radius:var(--blob-1)}
.aslot:nth-child(2){border-radius:var(--blob-2)}
.tabs,.world-btn,.done,.share,.mute,.woff,.rm,.toast,.tune,.steps,.types button:nth-child(odd){border-radius:var(--pill-1)}
.tabs button:nth-child(1),.next,.listen,.songrec,.seg,.pitch,.sel-wrap select,.ed-top input,.wopt,.types button:nth-child(even){border-radius:var(--pill-2)}
.tabs button:nth-child(2){border-radius:var(--pill-1)}
.seg button:nth-child(odd){border-radius:var(--pill-1)}
.seg button:nth-child(even){border-radius:var(--pill-2)}
.chip:nth-child(odd){border-radius:var(--pill-1)}
.chip:nth-child(even){border-radius:var(--pill-2)}
.play,.steps button,.wopt .wi{border-radius:var(--bub-1)}
.hub,.pitch button{border-radius:var(--bub-2)}
.slot:nth-child(3n){border-radius:var(--bub-1)}
.slot:nth-child(3n+1){border-radius:var(--bub-2)}
.slot:nth-child(3n+2){border-radius:var(--bub-3)}
.pop,.wmenu{border-radius:var(--blob-2)}
.sheet{border-radius:48px 66px 0 0 / 40px 54px 0 0}
.wave{border-radius:28px 40px 30px 44px / 36px 28px 42px 30px}
input[type=range]{border-radius:6px 10px 7px 9px}
input[type=range]::-webkit-slider-thumb{border-radius:52% 48% 55% 45% / 48% 54% 46% 52%}
button{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background-color .25s,color .25s}
button:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

.pond-empty{width:min(84%,580px)}
body.magic .pond{background:linear-gradient(170deg,var(--water),var(--water-deep))}
.pond-empty img{display:block;width:100%;height:auto;animation:bob 6s ease-in-out infinite alternate;-webkit-user-drag:none}
@keyframes bob{from{transform:translateY(-5px) rotate(-1deg)}to{transform:translateY(5px) rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.pond-empty img{animation:none}}
</style>

  if (md === 'robot') front = '<rect x="33" y="28" width="10" height="10" rx="2" fill="#1B2A41"/><rect x="57" y="28" width="10" height="10" rx="2" fill="#1B2A41"/>';
  var w = '';

/* ================= Audio engine ================= */
var ctx = null, N = {}, panOK = false;

function grain(s, gt, off, size, rate, gv, dest, pan){
  var src = ctx.createBufferSource(); src.buffer = buf(s); src.playbackRate.value = rate;
  var g = ctx.createGain();
  g.gain.setValueAtTime(0, gt);
  g.gain.linearRampToValueAtTime(gv, gt + size*0.5);
  g.gain.linearRampToValueAtTime(0, gt + size);
  src.connect(g);
  var node = g;
  if (panOK){ var p = ctx.createStereoPanner(); p.pan.value = pan === undefined ? Math.random()*1.6-0.8 : pan; g.connect(p); node = p; }
  node.connect(dest);
  src.start(gt, off); src.stop(gt + size + 0.02);
}
function playGrains(s, t, rate, vol, rates){
  var len = Math.max(0.03, s.end - s.start), n = 5, v = vol * s.norm * 1.2;
  for (var k=0;k<n;k++){
    var gt = t + 0.03 + (k/n)*1.0 + Math.random()*0.05;
    var size = 0.08 + Math.random()*0.18, r = rate * pick(rates);
    var off = s.start + Math.random()*Math.max(0, len - size*r);
    grain(s, gt, off, size, r, v*(1 - k/n*0.5), N.tone.in);
  }
}
/* Glitch slices for the ambient channel */
function slice(b, t, off, len, rate, gv, pan){
  var src = ctx.createBufferSource(); src.buffer = b; src.playbackRate.value = rate;
  var g = ctx.createGain(), f = Math.min(0.004, len/4);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gv, t+f);
  g.gain.setValueAtTime(gv, t+len-f); g.gain.linearRampToValueAtTime(0, t+len);
  src.connect(g);
  var node = g;
  if (panOK){ var p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
  node.connect(N.amb.in);
  src.start(t, Math.max(0, off)); src.stop(t + len + 0.02);
}
function glitch(s, t, six){
  var len = s.end - s.start; if (len < 0.2) return;
  var gv = S.ambVol * s.norm * 0.42 * magicAmt, pan = Math.random()*1.2 - 0.6;
  var kind = pick(['stutter','stutter','stutter','stutter','reverse','jump']);
  if (kind === 'stutter'){
    var sl = pick([six, six, six/2, six*2]), reps = pick([2,3,4]), rate = pick([1,1,1,1,2]);
    var off = s.start + Math.random()*Math.max(0, len - sl*rate);
    for (var k=0;k<reps;k++) slice(buf(s), t + k*sl, off, sl*0.92, rate, gv*(1 - k/reps*0.55), clamp(pan + (k%2 ? 0.35 : -0.35), -1, 1));
  } else if (kind === 'reverse'){
    var sl2 = six*pick([2,4]), off2 = s.start + Math.random()*Math.max(0, len - sl2);
    slice(rbuf(s), t, s.dur - (off2 + sl2), sl2, 1, gv, pan);
  } else {
    var sl3 = six*2, r3 = pick([2,2,0.5]), off3 = s.start + Math.random()*Math.max(0, len - sl3*r3);
    slice(buf(s), t, off3, sl3, r3, gv, -pan); slice(buf(s), t + sl3, off3, sl3, r3, gv*0.6, pan);
  }
}
function bubble(t){                       // small rising "bloop" tuned to the scale
  var o = ctx.createOscillator(), g = ctx.createGain();
  var midi = 72 + S.root + deg2semi(Math.floor(Math.random()*6)), f = 440*Math.pow(2, (midi-69)/12);
  o.frequency.setValueAtTime(f*0.7, t); o.frequency.exponentialRampToValueAtTime(f*1.2, t + 0.09);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07*magicAmt*S.ambVol + 0.0001, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(g); g.connect(N.bubbles); o.start(t); o.stop(t + 0.2);
}
function ambExtras(t, six, tk){
  if (magicAmt < 0.05 || tk % 2) return;
  var gp = WP('amb','glitch')*magicAmt;
  if (gp && Math.random() < gp){
    var c = []; S.amb.forEach(function(a){ var s = a && S.sounds.get(a.id); if (s) c.push(s); });
    if (c.length) glitch(pick(c), t, six);
  }
  var bp = WP('amb','bubbles')*magicAmt;
  if (bp && Math.random() < bp) bubble(t + Math.random()*six);
}

/* ---------- Pitch: detect + auto-tune tone sounds ---------- */
function detectPitch(s){
  var q = s.sr >= 32000 ? 2 : 1, sr = s.sr/q;
  var a = Math.floor((s.start + Math.min(0.04, (s.end-s.start)*0.2))*s.sr), b = Math.floor(s.end*s.sr);
  var n = Math.floor((b-a)/q); if (n < 600) return 0;
  var d = new Float32Array(n);
  for (var i=0;i<n;i++){ var j = a + i*q; d[i] = q === 2 ? (s.data[j] + s.data[j+1])*0.5 : s.data[j]; }
  var maxLag = Math.min(Math.floor(sr/60), Math.floor(n/3)), minLag = Math.max(2, Math.floor(sr/1400));
  var W = Math.min(1024, n - maxLag - 1); if (W < 256 || maxLag <= minLag+2) return 0;
  var ests = [], df = new Float32Array(maxLag+2), cm = new Float32Array(maxLag+2);
  for (var st = 0; st + W + maxLag < n && ests.length < 12; st += 512){
    var e = 0; for (i=0;i<W;i++) e += d[st+i]*d[st+i];
    if (Math.sqrt(e/W)*s.norm < 0.03) continue;
    for (var tau=1; tau<=maxLag+1; tau++){
      var sum = 0; for (i=0;i<W;i++){ var x = d[st+i] - d[st+i+tau]; sum += x*x; } df[tau] = sum;
    }
    var run = 0; cm[0] = 1;
    for (tau=1; tau<=maxLag+1; tau++){ run += df[tau]; cm[tau] = run ? df[tau]*tau/run : 1; }
    var te = -1;
    for (tau=minLag; tau<=maxLag; tau++){ if (cm[tau] < 0.2){ while (tau+1 <= maxLag && cm[tau+1] < cm[tau]) tau++; te = tau; break; } }
    if (te < 0) continue;
    var x0 = cm[te-1], x1 = cm[te], x2 = cm[te+1], den = x0 + x2 - 2*x1;
    ests.push(sr / (te + (den ? (x0 - x2)/(2*den) : 0)));
  }
  if (ests.length < 2) return 0;
  ests.sort(function(p,r){ return p-r; });
  var med = ests[Math.floor(ests.length/2)], ok = ests.filter(function(f){ return Math.abs(f/med - 1) < 0.04; }).length;
  return ok >= Math.max(2, ests.length*0.5) ? med : 0;
}
function tuneOf(s){
  if (!s.f0 || s.autotune === false) return 0;
  var midi = 69 + 12*Math.log(s.f0/440)/Math.LN2;
  var diff = ((S.root - midi) % 12 + 12) % 12;          // 0..12 up to the nearest root
  return diff > 6 ? diff - 12 : diff;
}

/* ch = which channel the sound plays through: perc | tone | amb */
function trigger(s, t, semi, vol, ch, echo){
  var rate = Math.pow(2, semi/12), m = magicAmt;
  if (ch === 'perc') return playDry(s, t, rate, vol, N.perc.in, (echo && m > 0.02) ? WP('perc','echo')*m : 0);
  if (ch === 'tone'){
    rate *= Math.pow(2, tuneOf(s)/12);
    var g = WP('tone','grains'), v = playDry(s, t, rate, vol*(1 - 0.3*g*m), N.tone.in, 0);
    if (g > 0 && m > 0.02) playGrains(s, t, rate, vol*m*g, WP('tone','grainRates'));
    return v;
  }
  return playDry(s, t, rate, vol, N.amb.in, 0);
}
var prevVoice = null;
function preview(s, semi, ch){
  ensureCtx();
  var t = ctx.currentTime + 0.01;
  ch = ch || s.type;
  choke(prevVoice, t);
  prevVoice = trigger(s, t, semi||0, 1, ch, false);
  if (ch === 'amb' && magicAmt > 0.05 && WP('amb','glitch')) glitch(s, t + beat(), beat()/4);
}

/* ---------- Sequencer ---------- */
var playing = false, timer = null, tick = 0, nextT = 0, vq = [], lastVoices = [null,null,null];
function stepDeg(r){ return 360 / r.len; }
function rotSteps(r){ return ((Math.round(r.rot/stepDeg(r)) % r.len) + r.len) % r.len; }

function schedule(){
  var ahead = ctx.currentTime + 0.12, td = 60 / S.bpm / 4;
  while (nextT < ahead){
    if (tick % 64 === 0 && tick > 0 && magicAmt > 0.05 && WP('tone','wander'))
      N.sd.delayTime.setTargetAtTime(pick([0.5,0.75,0.75,1])*beat(), nextT, 0.6);
    for (var ri=0; ri<3; ri++){
      var r = S.rings[ri], div = SPEEDDIV[String(r.speed)];
      if (tick % div) continue;
      var pos = (tick/div) % r.len;
      var si = ((pos - rotSteps(r)) % r.len + r.len) % r.len;
      vq.push({t:nextT, ri:ri, pos:pos, si:si, len:r.len});
      var slot = r.slots[si];
      if (!slot || r.mute) continue;
      var s = S.sounds.get(slot.id); if (!s) continue;
      if (ri > 0) choke(lastVoices[ri], nextT);
      var v = trigger(s, nextT, deg2semi(slot.deg), ri===0 ? 1 : 0.8, ri===0 ? 'perc' : 'tone', ri===0 && ECHO_SLOTS[si]);
      if (ri > 0) lastVoices[ri] = v;
    }
    ambExtras(nextT, td, tick);
    nextT += td; tick++;
  }
}

/* ---------- Ambient bed ---------- */
var ambVoices = [];
function ambLevel(s){ return S.ambVol * s.norm * 0.6 * (1 - 0.15*magicAmt); }
function ambRate(){ return 1 + (WP('amb','rate') - 1)*magicAmt; }
function startAmb(){
  stopAmb(0.15);
  S.amb.forEach(function(a){
    if (!a) return; var s = S.sounds.get(a.id); if (!s) return;
    var src = ctx.createBufferSource(); src.buffer = buf(s); src.loop = true;
    src.loopStart = s.start; src.loopEnd = s.end; src.playbackRate.value = ambRate();
    var g = ctx.createGain(); g.gain.value = 0;
    g.gain.setTargetAtTime(ambLevel(s), ctx.currentTime, 0.4);
    src.connect(g); g.connect(N.amb.in);
    src.start(ctx.currentTime, s.start);
    ambVoices.push({src:src, g:g, s:s});
  });
  renderAmb();
}
function stopAmb(fade){
  if (!ctx) return;
  ambVoices.forEach(function(v){
    try { v.g.gain.cancelScheduledValues(ctx.currentTime); v.g.gain.setTargetAtTime(0, ctx.currentTime, fade/3); v.src.stop(ctx.currentTime + fade + 0.1); } catch(e){}
  });
  ambVoices = [];
}
function updateAmbGain(k){
  if (!ctx) return;
  ambVoices.forEach(function(v){
    v.g.gain.setTargetAtTime(ambLevel(v.s), ctx.currentTime, k || 0.12);
    v.src.playbackRate.setTargetAtTime(ambRate(), ctx.currentTime, 0.5);
  });
}

function play(){
  ensureCtx();
  playing = true; tick = 0; nextT = ctx.currentTime + 0.08; vq = [];
  startAmb(); schedule();
  timer = setInterval(schedule, 25);
  $('#playBtn').classList.add('on'); $('#playBtn').setAttribute('aria-label','Stoppa');
  document.body.classList.add('playing');
}
function stop(){
  playing = false; clearInterval(timer);
  stopAmb(0.5);
  lastVoices.forEach(function(v){ choke(v, ctx.currentTime); });
  lastVoices = [null,null,null]; vq = [];
  $('#playBtn').classList.remove('on'); $('#playBtn').setAttribute('aria-label','Spila');
  document.body.classList.remove('playing');
  ringEls.forEach(function(r){ r.ph.style.transform = 'rotate(0deg)'; });
  renderAmb();
  if (songRec) setTimeout(stopSong, 1500);          // let the reverb tail finish
}

/* ---------- Worlds on/off ---------- */
function setWorld(id){                    // id = null turns magic off
  ensureCtx();

  if (on) S.world = id;
  magicTarget = on ? 1 : 0;
  Object.keys(WORLDS).forEach(function(w){ document.body.classList.toggle('w-' + w, on && w === S.world); });

  $('#worldName').textContent = on ? WORLDS[S.world].name : 'Töfraheimar';

    rampRunning = true;
    var last = performance.now();
    var step = function(now){
      var dt = Math.max(0, (now - last)/1000); last = now;

}

/* ================= Recording sounds ================= */
var mic = null, rec = null;
async function getMic(){
  if (mic && mic.getAudioTracks().some(function(t){ return t.readyState === 'live'; })) return mic;
  mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  return mic;
}
async function startRec(type, card){
  ensureCtx();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Þessi vafri leyfir ekki upptöku. Veldu hljóðskrá í staðinn.'); return;
  }
  try { await getMic(); }
  catch(e){ toast('Fékk ekki aðgang að hljóðnemanum. Leyfðu hljóðnema í stillingum vafrans, eða veldu hljóðskrá.'); return; }
  var src = ctx.createMediaStreamSource(mic);
  var proc = ctx.createScriptProcessor(4096, 1, 1);
  var mute = ctx.createGain(); mute.gain.value = 0;
  var chunks = [], lvl = 0;
  proc.onaudioprocess = function(e){
    var d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    var m = 0; for (var i=0;i<d.length;i+=16){ var a = Math.abs(d[i]); if (a > m) m = a; } lvl = m;
  };
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
  var t0 = performance.now(), max = TYPES[type].max*1000;
  var shape = card.querySelector('.rec-btn .shape'), txt = card.querySelector('.txt');
  rec = {type:type, card:card, src:src, proc:proc, mute:mute, chunks:chunks, txt:txt, orig:txt.textContent, shape:shape};
  card.classList.add('on');
  rec.iv = setInterval(function(){
    var el = performance.now() - t0;
    txt.innerHTML = 'Tek upp… <span class="time">' + fmt(Math.max(0,(max-el)/1000)) + ' s</span> eftir. Ýttu til að stoppa.';
    shape.style.transform = 'scale(' + (1 + Math.min(1, lvl*2)*0.35).toFixed(3) + ')';
    if (el >= max) stopRec();
  }, 50);
}
function stopRec(){
  if (!rec) return;
  var r = rec; rec = null;
  clearInterval(r.iv);
  try { r.src.disconnect(); r.proc.disconnect(); r.mute.disconnect(); } catch(e){}
  r.proc.onaudioprocess = null;
  r.card.classList.remove('on'); r.txt.textContent = r.orig; r.shape.style.transform = '';
  var n = 0; r.chunks.forEach(function(c){ n += c.length; });
  if (n < ctx.sampleRate*0.2){ toast('Upptakan var of stutt. Haltu áfram aðeins lengur.'); return; }
  var data = new Float32Array(n), o = 0;
  r.chunks.forEach(function(c){ data.set(c, o); o += c.length; });
  addSound(r.type, data, ctx.sampleRate);
}

var uploadType = 'perc';
async function loadFile(file, type){
  ensureCtx();
  try {
    var ab = await new Response(file).arrayBuffer();
    var b = await new Promise(function(res, rej){ ctx.decodeAudioData(ab, res, rej); });
    var len = Math.min(b.length, Math.floor(b.sampleRate * (type === 'amb' ? 30 : 8)));
    var d = new Float32Array(len), ch = b.numberOfChannels;
    for (var c=0;c<ch;c++){ var x = b.getChannelData(c); for (var i=0;i<len;i++) d[i] += x[i]/ch; }
    addSound(type, d, b.sampleRate);
  } catch(e){ toast('Ekki tókst að lesa skrána. Prófaðu aðra hljóðskrá.'); }
}

function analyse(data, sr, type){
  var peak = 0;
  for (var i=0;i<data.length;i++){ var a = Math.abs(data[i]); if (a > peak) peak = a; }
  var norm = peak > 0.0001 ? Math.min(0.9/peak, 12) : 1;
  var dur = data.length / sr, start = 0, end = dur;
  if (type !== 'amb'){
    var th = peak*0.18, j = Math.min(data.length-1, Math.floor(sr*0.06));
    for (; j<data.length; j++) if (Math.abs(data[j]) > th) break;
    start = Math.max(0, j/sr - 0.008);
    if (start >= dur - 0.05) start = 0;
    end = Math.min(dur, start + TYPES[type].trim);
  }
  return {norm:norm, start:start, end:end, dur:dur};
}
function addSound(type, data, sr){
  var a = analyse(data, sr, type);
  counter[type]++;
  var s = {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:type,
    name:TYPES[type].label+' '+counter[type], data:data, sr:sr, start:a.start, end:a.end,
    norm:a.norm, dur:a.dur, v:counter[type]-1, t:Date.now(), f0:0, autotune:true};
  if (type === 'tone') s.f0 = detectPitch(s);
  S.sounds.set(s.id, s);
  spawnBlob(s, true);
  renderTray();
  dbPut(s);
  preview(s);
  ping(s.id);
}

/* ================= Pond ================= */
var pond = $('#pond'), blobs = new Map();
function waveD(s){
  var nb = 12, st = Math.floor(s.start*s.sr), step = Math.max(1, Math.floor((s.end-s.start)*s.sr/nb)), d = '';
  for (var k=0;k<nb;k++){
    var m = 0, a = st + k*step, b = Math.min(s.data.length, a+step);
    for (var i=a;i<b;i+=8){ var v = Math.abs(s.data[i]); if (v > m) m = v; }
    var h = Math.max(0.8, Math.min(1, m*s.norm)*13), x = (31 + k*38/(nb-1)).toFixed(1);
    d += 'M' + x + ' ' + (50-h).toFixed(1) + 'V' + (50+h).toFixed(1);
  }
  return d;
}
function blobSVG(s){ return shapeSVG(s.type, s.v||0, mode(), colorFor(s), waveD(s)); }
function spawnBlob(s, fresh){
  var el = document.createElement('div');
  el.className = 'blob ' + s.type + (fresh ? ' new' : '');

  var W = pond.clientWidth || 600, H = pond.clientHeight || 300;
  var b = {el:el, s:s, sz:sz,
    x: fresh ? W/2 - sz/2 + (Math.random()-0.5)*40 : Math.random()*Math.max(1, W-sz),
    y: fresh ? H/2 - sz/2 + (Math.random()-0.5)*30 : Math.random()*Math.max(1, H-sz-28),
    vx:(Math.random()-0.5)*50, vy:(Math.random()-0.5)*50, ph:Math.random()*6.28};
  blobs.set(s.id, b);
  el.addEventListener('click', function(){ preview(s); ping(s.id); openEditor(s.id); });
  if (fresh) setTimeout(function(){ el.classList.remove('new'); }, 600);
  $('#pondEmpty').style.display = 'none';
}
function refreshBlob(s){

  b.sz = TYPES[s.type].size;
  b.el.className = 'blob ' + s.type;
  b.el.style.setProperty('--sz', b.sz + 'px');

}
function ping(id){
  var b = blobs.get(id);
  if (b){ b.el.classList.remove('ping'); void b.el.offsetWidth; b.el.classList.add('ping'); b.vx += (Math.random()-0.5)*60; b.vy -= 30; }
}
function physics(dt){
  var W = pond.clientWidth, H = pond.clientHeight; if (!W) return;
  var list = Array.from(blobs.values()), sp = REDUCED ? 0.35 : 1;
  for (var i=0;i<list.length;i++){
    var b = list[i];
    b.ph += dt*0.6;
    b.vx += Math.cos(b.ph*1.3 + i)*14*dt*sp;
    b.vy += Math.sin(b.ph + i*0.7)*14*dt*sp;
    for (var j=i+1;j<list.length;j++){
      var o = list[j], dx = (o.x+o.sz/2)-(b.x+b.sz/2), dy = (o.y+o.sz/2)-(b.y+b.sz/2);
      var dist = Math.sqrt(dx*dx+dy*dy) || 1, min = (b.sz+o.sz)/2 + 14;
      if (dist < min){ var f = (min-dist)/min*60*dt, ux = dx/dist, uy = dy/dist;
        b.vx -= ux*f*10; b.vy -= uy*f*10; o.vx += ux*f*10; o.vy += uy*f*10; }
    }
  }
  list.forEach(function(b){
    var damp = Math.pow(0.6, dt);

/* ---------- Drag & drop ---------- */
var dragSt = null;

  window.addEventListener('pointercancel', dCancel);

function dMove(e){

    var s = S.sounds.get(d.p.id);
    d.ghost = document.createElement('div'); d.ghost.className = 'ghost'; d.ghost.innerHTML = miniHTML(s);
    document.body.appendChild(d.ghost);
    if (d.p.from) d.el.style.opacity = '.3';

}
function dCancel(){ var d = dragSt; dragSt = null; endListeners(); if (d){ if (d.ghost) d.ghost.remove(); if (d.over) d.over.classList.remove('over'); d.el.style.opacity = ''; } }
function dUp(e){

  d.ghost.remove(); d.el.style.opacity = '';
  if (d.over){ d.over.classList.remove('over'); placeAt(d.p, d.over); }
  else if (d.p.from){ removeFrom(d.p.from); }
}
function placeAt(p, t){
  var s = S.sounds.get(p.id); if (!s) return;
  var from = p.from, ambChanged = !!(from && from.k === 'amb');
  if (t.classList.contains('slot')){
    var ri = +t.dataset.ring, si = +t.dataset.slot, ring = S.rings[ri], prev = ring.slots[si];
    if (from && from.k === 'ring'){
      if (from.ri === ri && from.si === si) return;
      var moving = S.rings[from.ri].slots[from.si];
      S.rings[from.ri].slots[from.si] = prev;           // swap
      ring.slots[si] = moving;
    } else {
      if (from && from.k === 'amb') S.amb[from.i] = null;
      ring.slots[si] = {id:p.id, deg:PAT[ri][si]};
    }

  } else {
    var i = +t.dataset.i, prevA = S.amb[i];

    else { if (from && from.k === 'ring') S.rings[from.ri].slots[from.si] = null; S.amb[i] = {id:p.id}; }

/* ================= Recording the song ================= */
var songRec = null, songBlob = null, songURL = null, songExt = 'mp4', dl = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function(ns){ dl = ns; }, function(){}); } catch(e){}
function pickMime(){
  if (!window.MediaRecorder) return null;
  var c = ['audio/mp4','audio/webm;codecs=opus','audio/webm'];
  if (typeof MediaRecorder.isTypeSupported !== 'function') return '';
  for (var i=0;i<c.length;i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
  return '';
}
function startSong(){
  ensureCtx();
  var mime = pickMime();
  if (mime === null || typeof ctx.createMediaStreamDestination !== 'function'){ toast('Þessi vafri getur ekki tekið upp lagið.'); return; }
  if (!N.recDest) N.recDest = ctx.createMediaStreamDestination();
  N.final.connect(N.recDest);
  var mr;
  try { mr = mime ? new MediaRecorder(N.recDest.stream, {mimeType:mime}) : new MediaRecorder(N.recDest.stream); }
  catch(e){ try { N.final.disconnect(N.recDest); } catch(er){} toast('Ekki tókst að byrja upptöku á laginu.'); return; }
  var chunks = [];
  mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = function(){
    try { N.final.disconnect(N.recDest); } catch(e){}
    var type = mr.mimeType || mime || 'audio/webm';
    if (!chunks.length){ toast('Upptakan tókst ekki. Prófaðu aftur.'); return; }
    openSong(new Blob(chunks, {type:type}), /mp4/.test(type) ? 'mp4' : 'webm');
  };
  mr.start(250);
  songRec = {mr:mr, t0:performance.now()};
  $('#songRec').classList.add('on');
  songRec.iv = setInterval(function(){
    if (!songRec) return;
    var s = (performance.now() - songRec.t0)/1000;
    $('#songRecTxt').textContent = 'Stoppa upptöku ' + mmss(s);
    if (s > 300) stopSong();
  }, 250);
  $('#songRecTxt').textContent = 'Stoppa upptöku 0:00';
  if (!playing) play();
}
function stopSong(){
  if (!songRec) return;
  var r = songRec; songRec = null; clearInterval(r.iv);
  $('#songRec').classList.remove('on'); $('#songRecTxt').textContent = 'Taka upp lag';
  try { r.mr.stop(); } catch(e){}
}
function openSong(blob, ext){
  if (songURL) URL.revokeObjectURL(songURL);
  songBlob = blob; songExt = ext; songURL = URL.createObjectURL(blob);
  $('#songAudio').src = songURL;
  var share = $('#songShare'); share.classList.add('hidden');
  try {
    var f = new File([blob], 'lag.' + ext, {type:blob.type});
    if (navigator.canShare && navigator.canShare({files:[f]})) share.classList.remove('hidden');
  } catch(e){}
  $('#songSheet').classList.add('on'); $('#scrim').classList.add('on');
}
function closeSong(){ $('#songSheet').classList.remove('on'); $('#scrim').classList.remove('on'); try { $('#songAudio').pause(); } catch(e){} }
function songFilename(){ return (($('#songName').value.trim() || 'Lagið okkar').replace(/[\\\/:*?"<>|]+/g, '').slice(0, 60) || 'Lagið okkar') + '.' + songExt; }
function anchorSave(fn){ var a = document.createElement('a'); a.href = songURL; a.download = fn; document.body.appendChild(a); a.click(); a.remove(); }
async function saveSong(){
  if (!songBlob) return;
  var fn = songFilename();
  if (dl){
    try { await dl.save({filename:fn, data:songBlob}); toast('Lagið var vistað.'); }
    catch(e){
      var c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited'){ toast('Bíddu andartak og reyndu aftur.'); return; }
      if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed'){ dl = null; anchorSave(fn); return; }
      toast('Ekki tókst að vista lagið.');
    }
    return;
  }
  anchorSave(fn);
}
$('#songRec').addEventListener('click', function(){ songRec ? stopSong() : startSong(); });
$('#songSave').addEventListener('click', saveSong);
$('#songShare').addEventListener('click', function(){
  if (!songBlob) return;
  var f = new File([songBlob], songFilename(), {type:songBlob.type});
  navigator.share({files:[f], title:$('#songName').value || 'Lagið okkar'}).catch(function(){});
});
$('#songClose').addEventListener('click', closeSong);
$('#scrim').addEventListener('click', function(){ if ($('#songSheet').classList.contains('on')) closeSong(); else closeEditor(); });

/* ================= Storage (IndexedDB, per iPad) ================= */
var db = null, saveT = 0;
function dbOpen(){
  return new Promise(function(res){
    try {
      var rq = indexedDB.open('hljodhringir', 1);
      rq.onupgradeneeded = function(){ var d = rq.result; d.createObjectStore('sounds', {keyPath:'id'}); d.createObjectStore('state'); };
      rq.onsuccess = function(){ db = rq.result; res(db); };
      rq.onerror = function(){ res(null); };
    } catch(e){ res(null); }
  });
}
function tx(store, md, fn){
  if (!db) return Promise.resolve(null);
  return new Promise(function(res){
    try {
      var t = db.transaction(store, md), r = fn(t.objectStore(store));
      t.oncomplete = function(){ res(r && r.result); };
      t.onerror = function(){ res(null); }; t.onabort = function(){ res(null); };
    } catch(e){ res(null); }
  });
}
function dbPut(s){ tx('sounds','readwrite', function(st){ return st.put({id:s.id,type:s.type,name:s.name,data:s.data,sr:s.sr,start:s.start,end:s.end,norm:s.norm,v:s.v,t:s.t,f0:s.f0||0,autotune:s.autotune!==false}); }); }
function dbDel(id){ tx('sounds','readwrite', function(st){ return st.delete(id); }); }
function saveState(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    tx('state','readwrite', function(st){
      return st.put({rings:S.rings.map(function(r){ return {slots:r.slots, rot:r.rot, speed:r.speed, mute:r.mute, len:r.len}; }),
        amb:S.amb, ambVol:S.ambVol, bpm:S.bpm, root:S.root, world:S.world}, 'main');
    });
  }, 300);
}
async function loadAll(){
  await dbOpen();
  var list = await tx('sounds','readonly', function(st){ return st.getAll(); }) || [];
  list.sort(function(a,b){ return a.t - b.t; });
  list.forEach(function(o){
    if (!o || !o.data) return;
    o.dur = o.data.length / o.sr;
    if (typeof o.v !== 'number') o.v = counter[o.type];
    counter[o.type] = Math.max(counter[o.type], o.v + 1);
    if (o.type === 'tone' && o.f0 === undefined){ o.f0 = detectPitch(o); o.autotune = true; dbPut(o); }
    S.sounds.set(o.id, o);
    spawnBlob(o, false);
  });
  var st = await tx('state','readonly', function(s){ return s.get('main'); });
  if (st){
    if (st.rings) st.rings.forEach(function(r, i){ var R = S.rings[i]; if (!R) return;
      R.slots = r.slots || R.slots; R.rot = r.rot||0; R.speed = r.speed||1; R.mute = !!r.mute; R.len = r.len || 8; });
    if (st.amb) S.amb = st.amb;
    if (typeof st.ambVol === 'number') S.ambVol = st.ambVol;
    if (st.bpm) S.bpm = st.bpm;
    if (typeof st.root === 'number') S.root = st.root;
    if (st.world && WORLDS[st.world]) S.world = st.world;
  }
  $('#bpm').value = S.bpm; $('#bpmOut').textContent = S.bpm; $('#ambVol').value = S.ambVol; $('#root').value = String(S.root);
  renderRings(); renderAmb(); renderTray();
}
var resetArmed = false;
$('#resetBtn').addEventListener('click', function(){
  var btn = $('#resetBtn');
  if (!resetArmed){ resetArmed = true; btn.classList.add('warn'); btn.textContent = 'Ýttu aftur til að eyða öllum hljóðum';
    setTimeout(function(){ resetArmed = false; btn.classList.remove('warn'); btn.textContent = 'Byrja upp á nýtt'; }, 4000); return; }
  resetArmed = false; btn.classList.remove('warn'); btn.textContent = 'Byrja upp á nýtt';
  if (playing) stop();
  S.sounds.clear(); blobs.forEach(function(b){ b.el.remove(); }); blobs.clear();
  S.rings = [newRing(), newRing(), newRing()];
  S.amb = [null,null]; counter = {perc:0,tone:0,amb:0};
  tx('sounds','readwrite', function(st){ return st.clear(); });
  saveState(); renderRings(); renderAmb(); renderTray();
  $('#pondEmpty').style.display = '';
});

/* ================= Wiring ================= */
function showPage(name){
  if (rec) stopRec();
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('on', p.id === 'page-' + name); });
  document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.page === name); });
  if (name === 'rada') renderTray();
}
document.querySelectorAll('.tabs button').forEach(function(b){ b.addEventListener('click', function(){ showPage(b.dataset.page); }); });
document.querySelector('[data-goto="rada"]').addEventListener('click', function(){ showPage('rada'); });

document.querySelectorAll('.rec').forEach(function(card){
  var type = card.dataset.type;
  card.querySelector('.rec-btn').addEventListener('click', function(){
    if (rec){ var same = rec.card === card; stopRec(); if (same) return; }
    startRec(type, card);
  });
  card.querySelector('.file').addEventListener('click', function(){ uploadType = type; $('#fileIn').click(); });
});
$('#fileIn').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if (f) loadFile(f, uploadType); e.target.value = '';
});
$('#playBtn').addEventListener('click', function(){ playing ? stop() : play(); });
$('#bpm').addEventListener('input', function(e){ S.bpm = +e.target.value; $('#bpmOut').textContent = S.bpm; syncDelays(); applyMagic(); saveState(); });
$('#ambVol').addEventListener('input', function(e){ S.ambVol = +e.target.value; updateAmbGain(); saveState(); });
$('#root').addEventListener('change', function(e){ S.root = +e.target.value; saveState(); if (edId) updateTuneUI(); });

// iOS needs audio to be unlocked inside a gesture
['pointerdown','touchend','click'].forEach(function(ev){
  document.addEventListener(ev, function(){ if (ctx && ctx.state !== 'running') ctx.resume(); }, {passive:true});
});


/* ---------- Floating dust & bubbles in the pond ---------- */
var dust = $('#dust'), dctx = dust.getContext ? dust.getContext('2d') : null, motes = [], dustW = 0, dustH = 0;
var DUST_COL = {base:'255,255,255', tofrar:'242,167,255', haf:'220,250,255', geimur:'255,233,163', robot:'56,225,255'};
function newMote(atBottom){
  var bubble = false;            // dust only
  return {x:Math.random()*dustW, y:atBottom ? dustH + 10 : Math.random()*dustH,
    r:bubble ? 2.5 + Math.random()*5 : 0.7 + Math.random()*1.8, b:bubble,
    vy:-(bubble ? 7 + Math.random()*12 : 2 + Math.random()*5), ph:Math.random()*6.28, wf:0.4 + Math.random()*0.9, a:0.3 + Math.random()*0.45};
}
function sizeDust(){
  var w = pond.clientWidth, h = pond.clientHeight;
  if (!w || !dctx) return false;
  if (w !== dustW || h !== dustH){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    dustW = w; dustH = h; dust.width = Math.round(w*dpr); dust.height = Math.round(h*dpr);
    dctx.setTransform(dpr,0,0,dpr,0,0);
    var want = clamp(Math.round(w*h/9000), 24, 70);
    while (motes.length < want) motes.push(newMote(false));
    motes.length = want;
  }
  return true;
}
function drawDust(dt){
  if (!sizeDust()) return;
  var md = mode() || 'base', col = DUST_COL[md], sp = REDUCED ? 0.25 : (md === 'geimur' ? 0.35 : 1);
  dctx.clearRect(0, 0, dustW, dustH);
  for (var i=0;i<motes.length;i++){
    var m = motes[i];
    m.ph += dt*m.wf;
    m.y += m.vy*dt*sp; m.x += Math.sin(m.ph)*7*dt*sp;
    if (m.y < -12 || m.x < -12 || m.x > dustW + 12){ motes[i] = m = newMote(true); }
    var a = m.a;
    if (md === 'tofrar' || md === 'geimur') a *= 0.55 + 0.45*Math.sin(m.ph*3);
    if (md === 'robot'){
      dctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
      var s = m.b ? m.r*1.2 : m.r*1.6; dctx.fillRect(Math.round(m.x), Math.round(m.y), s, s);
    } else if (m.b){
      dctx.strokeStyle = 'rgba(' + col + ',' + (a*0.9).toFixed(3) + ')'; dctx.lineWidth = 1.2;
      dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 6.2832); dctx.stroke();
      dctx.fillStyle = 'rgba(' + col + ',' + (a*0.8).toFixed(3) + ')';
      dctx.beginPath(); dctx.arc(m.x - m.r*0.35, m.y - m.r*0.35, m.r*0.22, 0, 6.2832); dctx.fill();
    } else {
      dctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
      dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 6.2832); dctx.fill();
    }
  }
}

/* ---------- Main animation loop ---------- */
var lastF = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - lastF)/1000); lastF = now;
  if ($('#page-safna').classList.contains('on')){ physics(dt); drawDust(dt); }
  if (ctx && playing){
    var t = ctx.currentTime;
    while (vq.length && vq[0].t <= t){
      var e = vq.shift(), RE = ringEls[e.ri]; if (!RE) continue;
      RE.ph.style.transform = 'rotate(' + (e.pos*360/e.len) + 'deg)';
      var sl = RE.slots[e.si];
      if (sl.classList.contains('filled') && !S.rings[e.ri].mute){
        sl.classList.add('hit');
        (function(el){ setTimeout(function(){ el.classList.remove('hit'); }, 130); })(sl);
      }
    }
  }
  requestAnimationFrame(frame);
}

paintIcons(); buildRings(); renderAmb(); renderTray();
loadAll();
requestAnimationFrame(frame);
window.addEventListener('resize', function(){ if (edId) drawWave(); });
})();
